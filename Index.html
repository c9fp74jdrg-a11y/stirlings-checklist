<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stirling's Checklist 🏎️</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e8000d;
    --yellow: #FFD700;
    --black: #0a0a0a;
    --dark: #111827;
    --card: #1a2234;
    --card2: #1e2a42;
    --text: #f0f4ff;
    --muted: #6b7fa8;
    --green: #00e676;
    --stripe: rgba(255,255,255,0.03);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Racing stripes background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      -55deg,
      transparent,
      transparent 40px,
      var(--stripe) 40px,
      var(--stripe) 80px
    );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 10px 0 20px;
  }

  .header-car {
    font-size: 52px;
    animation: carBounce 2s ease-in-out infinite;
    display: inline-block;
  }

  @keyframes carBounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }

  .header h1 {
    font-family: 'Exo 2', sans-serif;
    font-weight: 900;
    font-size: 2.2rem;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--yellow) 0%, var(--red) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-top: 4px;
  }

  .header .subtitle {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Day selector */
  .day-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .day-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 2px solid var(--card2);
    background: var(--card);
    color: var(--muted);
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    position: relative;
  }

  .day-btn .day-label { font-size: 0.6rem; letter-spacing: 0.5px; text-transform: uppercase; }
  .day-btn .day-num { font-size: 0.85rem; }

  .day-btn.active {
    border-color: var(--yellow);
    background: linear-gradient(135deg, #2a2400, #1a1800);
    color: var(--yellow);
    box-shadow: 0 0 12px rgba(255,215,0,0.3);
  }

  .day-btn.completed {
    border-color: var(--green);
    background: linear-gradient(135deg, #001a0d, #001508);
    color: var(--green);
  }

  .day-btn.completed::after {
    content: '✓';
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--green);
    color: #000;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
  }

  /* Progress bar */
  .progress-wrap {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .progress-label {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .progress-count {
    font-family: 'Exo 2', sans-serif;
    font-weight: 900;
    font-size: 1.1rem;
    color: var(--yellow);
  }

  .progress-track {
    height: 12px;
    background: rgba(255,255,255,0.07);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--red), var(--yellow));
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-width: 0;
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
    animation: shimmer 1.5s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* Checklist */
  .checklist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

  .check-item {
    background: var(--card);
    border: 2px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
    position: relative;
    overflow: hidden;
  }

  .check-item:active { transform: scale(0.97); }

  .check-item.checked {
    background: linear-gradient(135deg, #0d1f0f, #0a1a0c);
    border-color: var(--green);
    box-shadow: 0 0 20px rgba(0,230,118,0.12);
  }

  .check-item.optional {
    border-style: dashed;
    border-color: rgba(255,255,255,0.1);
  }

  .check-item.optional.checked {
    border-style: solid;
    border-color: #00c4ff;
    background: linear-gradient(135deg, #001a2e, #000f1e);
    box-shadow: 0 0 20px rgba(0,196,255,0.12);
  }

  .check-box {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    border: 2.5px solid rgba(255,255,255,0.2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    font-size: 1.2rem;
    background: rgba(255,255,255,0.04);
  }

  .check-item.checked .check-box {
    background: var(--green);
    border-color: var(--green);
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .check-item.optional.checked .check-box {
    background: #00c4ff;
    border-color: #00c4ff;
  }

  @keyframes popIn {
    0% { transform: scale(0.6) rotate(-15deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .check-text {
    flex: 1;
    font-size: 1.05rem;
    font-weight: 700;
    transition: all 0.25s;
  }

  .check-item.checked .check-text {
    text-decoration: line-through;
    color: var(--muted);
  }

  .check-emoji {
    font-size: 1.4rem;
    transition: transform 0.3s;
  }

  .check-item:hover .check-emoji { transform: scale(1.2); }

  .optional-tag {
    font-size: 0.6rem;
    background: rgba(255,255,255,0.08);
    color: var(--muted);
    padding: 2px 6px;
    border-radius: 99px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .check-item.optional.checked .optional-tag {
    background: rgba(0,196,255,0.15);
    color: #00c4ff;
  }

  /* Celebration overlay */
  .celebration {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }

  .celebration.show {
    opacity: 1;
    pointer-events: all;
  }

  .celebration-inner {
    text-align: center;
    transform: scale(0.7);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .celebration.show .celebration-inner { transform: scale(1); }

  .celebration-emoji { font-size: 5rem; animation: spin 0.8s ease-out; }

  @keyframes spin {
    0% { transform: rotate(-30deg) scale(0.5); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .celebration h2 {
    font-family: 'Exo 2', sans-serif;
    font-weight: 900;
    font-size: 2.5rem;
    background: linear-gradient(135deg, var(--yellow), var(--red));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 12px 0 8px;
  }

  .celebration p {
    font-size: 1rem;
    color: var(--muted);
    max-width: 260px;
  }

  .celebration-btn {
    margin-top: 24px;
    background: linear-gradient(135deg, var(--red), #ff6b00);
    border: none;
    color: #fff;
    font-family: 'Exo 2', sans-serif;
    font-weight: 900;
    font-size: 1rem;
    padding: 14px 32px;
    border-radius: 99px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(232,0,13,0.4);
    transition: transform 0.2s;
  }

  .celebration-btn:active { transform: scale(0.95); }

  /* Reward tracker */
  .reward-card {
    background: linear-gradient(135deg, #1a1200, #120d00);
    border: 2px solid rgba(255,215,0,0.25);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .reward-card::before {
    content: '🏆';
    position: absolute;
    right: -10px;
    bottom: -10px;
    font-size: 5rem;
    opacity: 0.1;
  }

  .reward-title {
    font-family: 'Exo 2', sans-serif;
    font-weight: 900;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--yellow);
    margin-bottom: 10px;
  }

  .reward-days {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .reward-day-dot {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 2px solid rgba(255,215,0,0.2);
    background: rgba(255,215,0,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transition: all 0.3s;
  }

  .reward-day-dot.done {
    background: rgba(255,215,0,0.15);
    border-color: var(--yellow);
    box-shadow: 0 0 10px rgba(255,215,0,0.2);
  }

  .reward-desc {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 700;
    line-height: 1.4;
  }

  .reward-desc strong {
    color: var(--yellow);
  }

  /* Confetti canvas */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }

  /* Reset btn */
  .reset-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .reset-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }

</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="celebration" id="celebration">
  <div class="celebration-inner">
    <div class="celebration-emoji">🏎️</div>
    <h2 id="cel-title">DONE!</h2>
    <p id="cel-msg">All checked off — amazing job, Stirling!</p>
    <button class="celebration-btn" onclick="closeCelebration()">VROOM! 🏁</button>
  </div>
</div>

<div class="container">
  <div class="header">
    <div class="header-car">🏎️</div>
    <h1>Stirling's<br>Checklist</h1>
    <div class="subtitle">Race to the finish line!</div>
  </div>

  <!-- Day selector -->
  <div class="day-bar" id="dayBar"></div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-label">Today's Progress</span>
      <span class="progress-count" id="progressCount">0 / 9</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Checklist -->
  <div class="checklist" id="checklist">
    <!-- generated by JS -->
  </div>

  <!-- Reward tracker -->
  <div class="reward-card">
    <div class="reward-title">🏆 Sunday Bonus Mission</div>
    <div class="reward-days" id="rewardDays"></div>
    <div class="reward-desc" id="rewardDesc">Complete all tasks for <strong>7 days</strong> to unlock <strong>+30 min game time</strong> on Sunday! 🎮</div>
  </div>

  <button class="reset-btn" onclick="confirmReset()">↺ Reset today's checklist</button>
</div>

<script>
const TASKS = [
  { id: 'books',   label: 'Pack books away',  emoji: '📚', optional: false },
  { id: 'schoolbag',label: 'School bag',      emoji: '🎒', optional: false },
  { id: 'lunchbox',label: 'Lunch box',        emoji: '🥪', optional: false },
  { id: 'shoes',   label: 'Check shoes',      emoji: '👟', optional: false },
  { id: 'socks',   label: 'Check socks',      emoji: '🧦', optional: false },
  { id: 'scooter', label: 'Check scooter',    emoji: '🛴', optional: false },
  { id: 'toys',    label: 'Check toys',       emoji: '🧸', optional: false },
  { id: 'teeth',   label: 'Brush teeth',      emoji: '🦷', optional: false },
  { id: 'shower',  label: 'Shower',           emoji: '🚿', optional: true  },
];

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const ctx = document.getElementById('confetti').getContext('2d');
const canvas = document.getElementById('confetti');
let confettiPieces = [];
let confettiRunning = false;

// ── Audio ──────────────────────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function getAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playRevSound() {
  const ac = getAudio();
  const t = ac.currentTime;

  // Engine noise oscillator
  const osc1 = ac.createOscillator();
  const osc2 = ac.createOscillator();
  const gain = ac.createGain();
  const gainNode = ac.createGain();

  osc1.type = 'sawtooth';
  osc2.type = 'square';

  // Rev up: pitch sweep
  osc1.frequency.setValueAtTime(80, t);
  osc1.frequency.exponentialRampToValueAtTime(320, t + 0.4);
  osc1.frequency.exponentialRampToValueAtTime(600, t + 0.7);
  osc1.frequency.exponentialRampToValueAtTime(200, t + 1.1);

  osc2.frequency.setValueAtTime(82, t);
  osc2.frequency.exponentialRampToValueAtTime(325, t + 0.4);
  osc2.frequency.exponentialRampToValueAtTime(605, t + 0.7);
  osc2.frequency.exponentialRampToValueAtTime(202, t + 1.1);

  gain.gain.setValueAtTime(0.3, t);
  gain.gain.setValueAtTime(0.4, t + 0.3);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);

  // Distortion (waveshaper)
  const wave = ac.createWaveShaper();
  wave.curve = makeDistortionCurve(80);

  osc1.connect(wave);
  osc2.connect(wave);
  wave.connect(gain);
  gain.connect(ac.destination);

  osc1.start(t);
  osc2.start(t);
  osc1.stop(t + 1.3);
  osc2.stop(t + 1.3);
}

function makeDistortionCurve(amount) {
  const n = 256, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = ((Math.PI + amount) * x) / (Math.PI + amount * Math.abs(x));
  }
  return curve;
}

function playApplause() {
  const ac = getAudio();
  const t = ac.currentTime;
  // Layered noise bursts simulating clapping crowd
  for (let i = 0; i < 12; i++) {
    const buf = ac.createBuffer(1, ac.sampleRate * 0.12, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let j = 0; j < data.length; j++) data[j] = (Math.random() * 2 - 1);

    const src = ac.createBufferSource();
    src.buffer = buf;

    const bpf = ac.createBiquadFilter();
    bpf.type = 'bandpass';
    bpf.frequency.value = 1500 + Math.random() * 2000;
    bpf.Q.value = 0.5;

    const g = ac.createGain();
    const delay = i * 0.06;
    g.gain.setValueAtTime(0, t + delay);
    g.gain.linearRampToValueAtTime(0.25, t + delay + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.1);

    src.connect(bpf);
    bpf.connect(g);
    g.connect(ac.destination);
    src.start(t + delay);
    src.stop(t + delay + 0.15);
  }
  // A triumphant chord
  setTimeout(() => playFanfare(), 400);
}

function playFanfare() {
  const ac = getAudio();
  const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
  notes.forEach((freq, i) => {
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const t = ac.currentTime + i * 0.08;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t); osc.stop(t + 0.8);
  });
}

// ── Storage ────────────────────────────────────────────────────────────
function getState() {
  try { return JSON.parse(localStorage.getItem('stirling_v2') || '{}'); } 
  catch { return {}; }
}

function saveState(s) {
  localStorage.setItem('stirling_v2', JSON.stringify(s));
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function dayOfWeek() { // 0=Mon
  return (new Date().getDay() + 6) % 7;
}

// ── State ──────────────────────────────────────────────────────────────
let state = getState();
if (!state.days) state.days = {}; // { 'dateKey': { taskId: bool, ... } }
if (!state.weekStart) state.weekStart = getMonday();
if (!state.completedWeeks) state.completedWeeks = 0;

let viewDay = todayKey(); // the date key being viewed
let activeDate = new Date(); // reference date for viewDay

function getMonday() {
  const d = new Date();
  const day = d.getDay(); const diff = (day === 0) ? -6 : 1 - day;
  d.setDate(d.getDate() + diff); d.setHours(0,0,0,0);
  return d.toISOString().split('T')[0];
}

// ── Build day bar ──────────────────────────────────────────────────────
function buildDayBar() {
  const bar = document.getElementById('dayBar');
  bar.innerHTML = '';
  const today = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    const dayOffset = i - dayOfWeek();
    d.setDate(today.getDate() + dayOffset);
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const dayData = state.days[key] || {};
    const isComplete = isDayComplete(dayData);
    const isToday = key === todayKey();

    const btn = document.createElement('button');
    btn.className = 'day-btn' + (key === viewDay ? ' active' : '') + (isComplete ? ' completed' : '');
    btn.innerHTML = `<span class="day-label">${DAYS[i]}</span><span class="day-num">${d.getDate()}</span>`;
    btn.onclick = () => { viewDay = key; render(); };
    if (key === todayKey()) btn.title = 'Today';
    bar.appendChild(btn);
  }
}

function isDayComplete(dayData) {
  return TASKS.filter(t => !t.optional).every(t => dayData[t.id]);
}

// ── Build checklist ────────────────────────────────────────────────────
function buildChecklist() {
  const list = document.getElementById('checklist');
  list.innerHTML = '';
  const dayData = state.days[viewDay] || {};
  const isToday = viewDay === todayKey();

  TASKS.forEach(task => {
    const checked = !!dayData[task.id];
    const item = document.createElement('div');
    item.className = 'check-item' + (checked ? ' checked' : '') + (task.optional ? ' optional' : '');
    item.innerHTML = `
      <div class="check-box">${checked ? '✓' : ''}</div>
      <span class="check-text">${task.label}</span>
      ${task.optional ? '<span class="optional-tag">Optional</span>' : ''}
      <span class="check-emoji">${task.emoji}</span>
    `;
    if (isToday) {
      item.onclick = () => toggleTask(task.id);
    } else {
      item.style.opacity = '0.7';
      item.style.cursor = 'default';
    }
    list.appendChild(item);
  });
}

// ── Progress ───────────────────────────────────────────────────────────
function updateProgress() {
  const dayData = state.days[viewDay] || {};
  const done = TASKS.filter(t => dayData[t.id]).length;
  const total = TASKS.length;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressCount').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = pct + '%';
}

// ── Reward tracker ─────────────────────────────────────────────────────
function updateReward() {
  const dotsEl = document.getElementById('rewardDays');
  const descEl = document.getElementById('rewardDesc');
  dotsEl.innerHTML = '';
  const today = new Date();
  let completedCount = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    const dayOffset = i - dayOfWeek();
    d.setDate(today.getDate() + dayOffset);
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const dayData = state.days[key] || {};
    const done = isDayComplete(dayData);
    if (done) completedCount++;
    const dot = document.createElement('div');
    dot.className = 'reward-day-dot' + (done ? ' done' : '');
    dot.textContent = done ? '🏁' : DAYS[i][0];
    dot.title = DAYS[i];
    dotsEl.appendChild(dot);
  }
  if (completedCount === 7) {
    descEl.innerHTML = `<strong>🎉 BONUS UNLOCKED!</strong> You earned <strong>+30 min game time</strong> this Sunday! Amazing work, Stirling! 🎮`;
  } else {
    const left = 7 - completedCount;
    descEl.innerHTML = `Complete all tasks for <strong>${left} more day${left !== 1 ? 's' : ''}</strong> this week to unlock <strong>+30 min game time</strong> on Sunday! 🎮`;
  }
}

// ── Toggle task ────────────────────────────────────────────────────────
function toggleTask(taskId) {
  if (!state.days[viewDay]) state.days[viewDay] = {};
  const wasChecked = !!state.days[viewDay][taskId];
  state.days[viewDay][taskId] = !wasChecked;
  saveState(state);

  if (!wasChecked) {
    playRevSound();
    // Check if all required done
    const requiredDone = TASKS.filter(t => !t.optional).every(t => state.days[viewDay][t.id]);
    const allDone = TASKS.every(t => state.days[viewDay][t.id]);
    
    if (requiredDone) {
      setTimeout(() => showCelebration(allDone), 300);
    }
  }

  render();
}

// ── Celebration ────────────────────────────────────────────────────────
function showCelebration(allOptional) {
  const el = document.getElementById('celebration');
  document.getElementById('cel-title').textContent = allOptional ? 'PERFECT! 🌟' : 'ALL DONE! 🏁';
  document.getElementById('cel-msg').textContent = allOptional
    ? 'Every single task done — including the shower! You\'re a CHAMPION, Stirling! 🏆'
    : 'All tasks checked off for today! Amazing job, Stirling! 🏎️';
  el.classList.add('show');
  playApplause();
  startConfetti();
}

function closeCelebration() {
  document.getElementById('celebration').classList.remove('show');
  stopConfetti();
}

// ── Confetti ───────────────────────────────────────────────────────────
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function startConfetti() {
  confettiPieces = [];
  for (let i = 0; i < 120; i++) {
    confettiPieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 200,
      w: 8 + Math.random() * 8,
      h: 5 + Math.random() * 5,
      color: ['#FFD700','#e8000d','#00e676','#00c4ff','#ff6b00','#ffffff'][Math.floor(Math.random()*6)],
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 8,
    });
  }
  confettiRunning = true;
  animateConfetti();
}

function stopConfetti() {
  confettiRunning = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function animateConfetti() {
  if (!confettiRunning) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confettiPieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.rot += p.rotV;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  });
  confettiPieces = confettiPieces.filter(p => p.y < canvas.height + 30);
  if (confettiPieces.length > 0) requestAnimationFrame(animateConfetti);
  else { confettiRunning = false; ctx.clearRect(0,0,canvas.width,canvas.height); }
}

// ── Reset ──────────────────────────────────────────────────────────────
function confirmReset() {
  if (confirm('Reset today\'s checklist? This can\'t be undone!')) {
    state.days[viewDay] = {};
    saveState(state);
    render();
  }
}

// ── Render ─────────────────────────────────────────────────────────────
function render() {
  buildDayBar();
  buildChecklist();
  updateProgress();
  updateReward();
}

render();
</script>
